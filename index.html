
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>WebGIS - NUIs</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

header {
  background: #17324d;
  color: white;
  padding: 15px;
}

#map {
  height: 85vh;
  width: 100%;
}
</style>
</head>

<body>

<header>
<h2>Mapeamento dos Núcleos Urbanos Informais</h2>
<p>Visualização geográfica dos NUIs</p>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Inicialização do mapa
const map = L.map('map');

// Mapa-base
L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap'
  }
).addTo(map);

// Carregamento do GeoJSON
fetch('./teste_pnui.geojson')
.then(response => response.json())
.then(data => {

  const camada = L.geoJSON(data, {

    style: function(feature) {
      return {
        color: '#174a70',
        weight: 1.5,
        fillColor: '#3498db',
        fillOpacity: 0.45
      };
    },

    onEachFeature: function(feature, layer) {

      const p = feature.properties;

      layer.bindPopup(`
        <h3>${p.V0 || 'NUI'}</h3>
        <b>Município:</b> ${p.V1 || '—'}<br>
        <b>Localidade:</b> ${p.V3a || '—'}<br>
        <b>Grupo:</b> ${p.V2b || '—'}<br>
        <b>Fonte:</b> ${p.V4b || '—'}<br>
        <b>Ano:</b> ${p.V4c || '—'}<br>
        <b>Área (ha):</b> ${p.area_ha || '—'}
      `);

    }

  }).addTo(map);

  // Ajustar o enquadramento aos polígonos
  if (camada.getLayers().length > 0) {
    map.fitBounds(camada.getBounds());
  }

})
.catch(error => {
  console.error('Erro ao carregar GeoJSON:', error);
});

</script>

</body>
</html>
